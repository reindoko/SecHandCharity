<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>

  <!-- Styling -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <!-- Left placeholder card, switch to photo or something later -->
    <section class="auth-info-card">
      <h2>A Second-Hand Charity.</h2>
      <h3>Placeholder!</h3>
    </section>

    <!-- Right login card -->
    <main class="auth-card">
      <h1>Welcome!</h1>

      <form id="login-form">
        <!-- Email/username field-->
        <div class="field-group">
          <div class="pill-input-wrap">
            <input
              id="login-identifier"
              class="pill-input"
              name="identifier"
              type="text"
              placeholder="Email or username"
              required
            >
          </div>
          <small class="field-error" id="login-identifier-error"></small>
        </div>

        <!-- Password field -->
        <div class="field-group">
          <div class="pill-input-wrap">
            <input
              id="login-password"
              class="pill-input has-icon"
              name="password"
              type="password"
              placeholder="Password"
              required
            >
            <button
              type="button"
              class="eye-toggle"
              id="toggle-login-password"
              aria-label="Toggle password visibility"
            >
              <img class="eye-icon-hidden" src="/assets/images/icon-eye-hidden.png" alt="Hidden password">
              <img class="eye-icon-show is-hidden" src="/assets/images/icon-eye-show.png" alt="Show password">
            </button>
          </div>
          <small class="field-error" id="login-password-error"></small>
        </div>

        <div class="auth-links">
          <a href="./register.html">Register New Account</a>
          <a href="#" id="forgot-password-link">Forgot Password?</a>
        </div>

        <small class="field-error" id="login-form-error"></small>

        <button type="submit" id="sign-in-btn" class="btn-pill">Sign In</button>
      </form>

      <div class="auth-divider"><span>Or</span></div>

      <button type="button" id="google-signin-btn" class="btn-pill btn-google">
        <span>Sign in with Google</span>
        <img class="google-icon" src="/assets/images/icon-google.png" alt="Google">
      </button>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="./auth.js"></script>
</body>
</html>
