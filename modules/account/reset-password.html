<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>

  <!-- Styling -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body class="auth-page">
  <!-- Centered single card -->
  <div class="auth-wrapper auth-wrapper--single">
    <main class="auth-card">
      <h1>Reset Your Password</h1>

      <form id="reset-password-form" novalidate>
        <!-- New password -->
        <div class="field-group">
          <div class="pill-input-wrap">
            <input
              id="new-password"
              class="pill-input has-icon"
              name="newPassword"
              type="password"
              placeholder="New password"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="eye-toggle"
              id="toggle-new-password"
              aria-label="Toggle new password visibility"
            >
              <img class="eye-icon-hidden" src="/assets/images/icon-eye-hidden.png" alt="Hidden password">
              <img class="eye-icon-show is-hidden" src="/assets/images/icon-eye-show.png" alt="Show password">
            </button>
          </div>
          <small class="field-error" id="new-password-error"></small>
        </div>

        <!-- Confirm new password -->
        <div class="field-group">
          <div class="pill-input-wrap">
            <input
              id="confirm-new-password"
              class="pill-input has-icon"
              name="confirmNewPassword"
              type="password"
              placeholder="Confirm new password"
              autocomplete="new-password"
              required
            >
            <button
              type="button"
              class="eye-toggle"
              id="toggle-confirm-password"
              aria-label="Toggle confirm password visibility"
            >
              <img class="eye-icon-hidden" src="/assets/images/icon-eye-hidden.png" alt="Hidden password">
              <img class="eye-icon-show is-hidden" src="/assets/images/icon-eye-show.png" alt="Show password">
            </button>
          </div>
          <small class="field-error" id="confirm-password-error"></small>
        </div>

        <small class="field-error" id="reset-form-error"></small>

        <button type="submit" id="reset-password-btn" class="btn-pill">Reset</button>
      </form>
    </main>
  </div>

  <!-- Scripts -->
  <script type="module" src="./auth.js"></script>
</body>
</html>
