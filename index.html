<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecHandCharity</title>

  <!-- Styling -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <!-- Scripts -->
  <script type="module">
    import { supabaseClient } from "/assets/js/supabase-client.js";
    import { ensureUserProfile } from "/modules/account/auth.js";

    try {
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      if (error) {
        console.error("Failed to check session:", error.message);
      }

      if (session?.user) {
        await ensureUserProfile(session.user);
        window.location.replace("/modules/account/settings.html"); // Rename once loh finish catalogue
      } else {
        window.location.replace("/modules/account/login.html");
      }
    } catch (err) {
      console.error("Initial route failed:", err);
    }
  </script>
</body>
</html>
